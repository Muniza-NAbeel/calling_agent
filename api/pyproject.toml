[project]
name = "hopenix-calling-api"
version = "0.1.0"
description = "Server-side orchestration for Hopenix AI calling."
requires-python = ">=3.11"
dependencies = [
  "elevenlabs>=1.10,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["src"]
strict = ["src"]
